[package]
name = "register"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Register – schnelle App für das Digitale Register"

[lib]
name = "register"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "register"
path = "src/main.rs"

[dependencies]
register-core = { path = "../core" }
slint = "1.18"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4"
notify-rust = "4"
rfd = "0.18"
dark-light = "2"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.android]
package = "com.webandgrow.register.rust"
apk_name = "Register-Rust"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Register Rust"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|keyboardHidden|screenLayout|uiMode"
