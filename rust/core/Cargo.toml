[package]
name = "register-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Register: talks to the Digitales Register and prepares its data"

[dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip", "json", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
