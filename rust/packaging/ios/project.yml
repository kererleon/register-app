# A minimal iOS app project around the Rust program: Xcode signs it with the
# developer's (free) Apple ID; the executable is replaced by the Rust build.
name: RegisterRust
options:
  bundleIdPrefix: com.webandgrow
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Release: Team.xcconfig
  Debug: Team.xcconfig
targets:
  RegisterRust:
    type: application
    platform: iOS
    sources:
      - Shell
    info:
      path: Shell/Info.plist
      properties:
        CFBundleDisplayName: Register Rust
        CFBundleExecutable: RegisterRust
        UILaunchScreen: {}
        # iOS 27 requires apps to declare the scene lifecycle.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webandgrow.register.rust
        PRODUCT_NAME: RegisterRust
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO
    postCompileScripts:
      - name: Use the Rust executable
        script: cp "$SRCROOT/../../target/aarch64-apple-ios/release/register" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
        basedOnDependencyAnalysis: false
